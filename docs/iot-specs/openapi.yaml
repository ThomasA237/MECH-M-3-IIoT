
openapi: 3.0.3

info:
  title: Microcontroller REST API
  description: |
    REST-Schnittstelle des Microcontrollers zur Konfiguration.
    Kommunikation erfolgt unverschlüsselt über HTTP.
    Die device_id darf nicht über POST geändert werden.
  version: 1.1.0

servers:
  - url: http://192.168.0.100
    description: Beispiel-Microcontroller

paths:
  /config:
    get:
      summary: Konfiguration abrufen
      description: Gibt die aktuelle Konfiguration zurück.
      responses:
        '200':
          description: Aktuelle Konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

    post:
      summary: Konfiguration ändern
      description: |
        Ändert ausschließlich das Sendeintervall.
        Die device_id darf nicht verändert werden.
        Änderungen erfolgen im laufenden Betrieb im RAM.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
            example:
              reading_interval_seconds: 10

      responses:
        '200':
          description: Konfiguration erfolgreich geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpdate'

        '400':
          description: Ungültige Konfiguration oder fehlerhaftes JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error

  /status:
    get:
      summary: Aktuellen Gerätestatus abrufen
      description: |
        Gibt die Geräte-ID, Laufzeit, WLAN- und MQTT-Verbindung
        sowie die letzten Messwerte zurück.

      responses:
        '200':
          description: Aktueller Gerätestatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
              example:
                device_id: "group6-pico"
                uptime_seconds: 150
                wifi_connected: true
                mqtt_connected: true
                last_telemetry:
                  timestamp: "2026-11-03T14:17:02Z"
                  value: 22.8
                  unit: "°C"
                last_humidity_percent: 61

components:
  schemas:
    Config:
      type: object
      properties:
        reading_interval_seconds:
          type: integer
          minimum: 2
          description: Sendeintervall in Sekunden
          example: 60

    ConfigUpdate:
      type: object
      description: Änderbare Konfigurationsparameter
      properties:
        reading_interval_seconds:
          type: integer
          minimum: 2
          description: Neues Sendeintervall in Sekunden
          example: 10

      required:
        - reading_interval_seconds

      additionalProperties: false

    
    DeviceStatus:
      type: object
      description: Aktueller Status des Microcontrollers
      properties:
        device_id:
          type: string
          description: Gerätekennung aus settings.toml

        uptime_seconds:
          type: integer
          minimum: 0
          description: Laufzeit seit Programmstart in Sekunden

        wifi_connected:
          type: boolean
          description: Status der WLAN-Verbindung

        mqtt_connected:
          type: boolean
          description: Status der MQTT-Verbindung

        last_telemetry:
          type: object
          nullable: true
          description: Letzte erfolgreich gesendete Temperaturmessung
          properties:
            timestamp:
              type: string
              format: date-time

            value:
              type: number

            unit:
              type: string
              enum:
                - "°C"

          required:
            - timestamp
            - value
            - unit

        last_humidity_percent:
          type: number
          nullable: true
          description: Zuletzt gemessene relative Luftfeuchtigkeit in Prozent

      required:
        - device_id
        - uptime_seconds
        - wifi_connected
        - mqtt_connected
        - last_telemetry
        - last_humidity_percent

      additionalProperties: false

